services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nacao
      POSTGRES_PASSWORD: nacao
      POSTGRES_DB: nacao
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nacao -d nacao"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgres://nacao:nacao@postgres:5432/nacao?sslmode=disable
      API_ADDR: :8080
      SEED_OPERADOR_EMAIL: operador@nacao.local
      SEED_OPERADOR_SENHA: nacao-dev
      COOKIE_SECURE: "false"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
